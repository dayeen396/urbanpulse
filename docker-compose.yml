services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "migrate", "--workspace", "@urbanpulse/api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  ml:
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /app/models
      NOISE_MODEL_METHOD: ${NOISE_MODEL_METHOD:-classical}
    volumes:
      - ./data:/app/data
      - ./data/ml-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "start", "--workspace", "@urbanpulse/api"]
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      STORAGE_DIR: /workspace/uploads
      MAX_AUDIO_SIZE_BYTES: ${MAX_AUDIO_SIZE_BYTES:-10000000}
      DELETE_AUDIO_AFTER_PROCESSING: ${DELETE_AUDIO_AFTER_PROCESSING:-false}
      NOISE_MODEL_METHOD: ${NOISE_MODEL_METHOD:-classical}
    ports:
      - "3000:3000"
    volumes:
      - audio_data:/workspace/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["npm", "run", "start", "--workspace", "@urbanpulse/worker"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      STORAGE_DIR: /workspace/uploads
      DELETE_AUDIO_AFTER_PROCESSING: ${DELETE_AUDIO_AFTER_PROCESSING:-false}
    volumes:
      - audio_data:/workspace/uploads
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command: ["npm", "run", "dev", "--workspace", "@urbanpulse/web", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  audio_data:
